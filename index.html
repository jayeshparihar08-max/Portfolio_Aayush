<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aayush | Video Editor & Designer</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="./src/css/variables.css">
    <link rel="stylesheet" href="./src/css/base.css">
    <link rel="stylesheet" href="./src/css/hero.css">
</head>
<body>

<!-- Initial Loading State -->
<div class="loader-overlay">
    <div class="loader-dot"></div>
</div>

<section class="hero" id="hero">
    
    <!-- Top Bar: Timeline -->
    <header class="hero-header-timeline">
        <div class="hero-timeline">
            <span class="active">01</span> &mdash; <span>02</span> &mdash; <span>03</span> &mdash; <span>04</span> &mdash; <span>05</span>
        </div>
    </header>

    <!-- Main Center Composition -->
    <div class="hero-composition">
        
        <!-- Avatar Left -->
        <div class="hero-avatar-wrapper">
            <img src="./src/assets/avatar/bird-filmmaker.png" alt="Aayush Mascot" class="hero-avatar">
            <div class="hero-shadow"></div>
        </div>

        <!-- Typography Right -->
        <div class="hero-text-wrapper">
            
            <div class="hero-label-name">AAYUSH</div>
            
            <h1 class="hero-title">
                <span class="letter-p">P</span><span class="letters-rest"><span class="letter">O</span><span class="letter">R</span><span class="letter">T</span><span class="letter">F</span><span class="letter">O</span><span class="letter">L</span><span class="letter">I</span><span class="letter">O</span></span>
            </h1>
            
            <div class="hero-label-bottom">
                <span class="role">Video Editor & Designer</span>
                <span class="year">2026</span>
            </div>

            <!-- Social Loop Area -->
            <div class="hero-socials-loop">
                <div class="social-label">CONNECT</div>
                
                <div class="social-wrapper">
                    <a href="#" aria-label="Instagram" class="social-container">
                        <div class="social-accent"></div>
                        <svg class="social-ring-svg" viewBox="0 0 72 72">
                            <circle cx="36" cy="36" r="34" fill="none" stroke="#F5A100" stroke-width="2" stroke-dasharray="214" stroke-dashoffset="214" />
                        </svg>
                        <div class="social-circle">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="20" x="2" y="2" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/></svg>
                        </div>
                    </a>
                </div>
                
                <div class="social-wrapper">
                    <a href="#" aria-label="WhatsApp" class="social-container">
                        <div class="social-accent"></div>
                        <svg class="social-ring-svg" viewBox="0 0 72 72">
                            <circle cx="36" cy="36" r="34" fill="none" stroke="#F5A100" stroke-width="2" stroke-dasharray="214" stroke-dashoffset="214" />
                        </svg>
                        <div class="social-circle">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
                        </div>
                    </a>
                </div>
                
                <div class="social-wrapper">
                    <a href="#" aria-label="Email" class="social-container">
                        <div class="social-accent"></div>
                        <svg class="social-ring-svg" viewBox="0 0 72 72">
                            <circle cx="36" cy="36" r="34" fill="none" stroke="#F5A100" stroke-width="2" stroke-dasharray="214" stroke-dashoffset="214" />
                        </svg>
                        <div class="social-circle">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                        </div>
                    </a>
                </div>
            </div>

        </div>

    </div>

</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="./src/js/hero-animation.js"></script>
</body>
</html>
